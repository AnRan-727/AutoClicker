# 推到 GitHub 后自动在云端 Mac 上打包，Apple 芯片和 Intel 各出一个 DMG
name: Build macOS DMG
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-13]   # macos-14 = Apple 芯片(arm64)，macos-13 = Intel(x86_64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          CI: "1"
        run: bash build_mac.command
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-${{ matrix.os }}
          path: dist/*.dmg
