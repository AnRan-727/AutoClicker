# 推送 v* 标签 → 在 Apple 芯片和 Intel Mac 上分别打包 → 创建 GitHub Release 并上传 DMG
# 也可以在 Actions 页面手动运行（只打包，不发布）
name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple 芯片 arm64
          - os: macos-15-intel    # Intel x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mac_autoclicker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DMG
        env:
          CI: "1"
          PYTHON: python3
        run: bash build_mac.command

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.os }}
          path: mac_autoclicker/dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="## ${TAG}" '
            $0 == tag {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "AutoClicker ${TAG}" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: AutoClicker ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*.dmg
